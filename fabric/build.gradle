plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    balanceTest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath + project(":common").sourceSets.balanceTest.output
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath + project(":common").sourceSets.balanceTest.output
    }
    qaTest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath + project(":common").sourceSets.qaTest.output
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath + project(":common").sourceSets.qaTest.output
    }
}

def balanceIsFiltered = ["balanceQuick", "balanceWeapon", "balanceBuild", "balanceScenario"].any { project.hasProperty(it) }
def balanceReportDir = { String loader ->
    file("${rootProject.buildDir}/reports/simplyswords-balance/${loader}" + (balanceIsFiltered ? "/scratch" : ""))
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    createRemapConfigurations(sourceSets.balanceTest)
    createRemapConfigurations(sourceSets.qaTest)

    mods {
        simplyswords {
            sourceSet sourceSets.main
        }
        simplyswords_balance_test {
            sourceSet sourceSets.balanceTest
            sourceSet "balanceTest", ":common"
        }
        simplyswords_qa {
            sourceSet sourceSets.qaTest
            sourceSet "qaTest", ":common"
        }
    }

    runs {
        balanceTestServer {
            server()
            source sourceSets.main
            source sourceSets.balanceTest
            property "fabric-api.gametest"
            property "fabric-api.gametest.report-file", new File(balanceReportDir("fabric"), "gametest-results.xml").absolutePath
            vmArg "-Dsimplyswords.balance-report-dir=${balanceReportDir("fabric").absolutePath}"
            if (project.hasProperty("balanceQuick")) {
                vmArg "-Dsimplyswords.balance.isolated-repetitions=1"
                vmArg "-Dsimplyswords.balance.rotation-repetitions=1"
                vmArg "-Dsimplyswords.balance.reliability-repetitions=1"
            }
            if (project.hasProperty("balanceWeapon")) vmArg "-Dsimplyswords.balance.weapon=${project.property("balanceWeapon")}"
            if (project.hasProperty("balanceBuild")) vmArg "-Dsimplyswords.balance.build=${project.property("balanceBuild")}"
            if (project.hasProperty("balanceScenario")) vmArg "-Dsimplyswords.balance.scenario=${project.property("balanceScenario")}"
            runDir "build/balance-gametest"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

def spellPowerTinyConfig = providers.provider {
    def spellPowerJar = configurations.modImplementation.resolve().find {
        it.name.startsWith("spell-power-") && it.name.endsWith(".jar")
    }
    def output = layout.buildDirectory.file("balance-libs/tiny-config-3.1.0-fabric.jar").get().asFile
    def archive = new java.util.zip.ZipFile(spellPowerJar)
    def entry = archive.getEntry("META-INF/jars/tiny-config-3.1.0-fabric.jar")
    output.parentFile.mkdirs()
    output.withOutputStream { stream -> archive.getInputStream(entry).transferTo(stream) }
    archive.close()
    return output
}

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal()
    maven {
        name 'Gegy'
        url 'https://maven.gegy.dev'
    }
    maven { url = "https://jitpack.io" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "FzzyMaven"
        url = "https://maven.fzzyhmstrs.me/"
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"
    modCompileOnly("com.terraformersmc:modmenu:${rootProject.mod_menu_version}") { transitive false }
    modImplementation "curse.maven:spell-power-771265:${rootProject.spellpower_fabric_file}"
    //modImplementation "curse.maven:lambdynamiclights-393442:${rootProject.lambdynlights_version}"
    //include modImplementation("dev.lambdaurora:spruceui:${rootProject.spruceui_version}") 1.21
    //modImplementation "curse.maven:eldritch-end-877553:${rootProject.eldritch_end_version}" 1.21
    //modImplementation "curse.maven:amethyst-imbuement-608261:4514358"
    //modImplementation(annotationProcessor("com.github.llamalad7.mixinextras:mixinextras-fabric:${rootProject.mixin_extras_version}")) 1.21

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    modImplementation "me.fzzyhmstrs:fzzy_config:${project.fzz_config_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    modRuntimeOnly "com.github.ZsoltMolnarrr:TinyConfig:2.3.2"
    modLocalRuntime "dev.emi:emi-fabric:${emi_version}"

    modBalanceTestImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modBalanceTestRuntimeOnly files("${rootDir}/../simplytooltips/fabric/build/libs/SimplyTooltips-fabric-0.1.5.jar")
    modBalanceTestRuntimeOnly files(spellPowerTinyConfig)

}

tasks.named("compileBalanceTestJava") {
    dependsOn project(":common").tasks.named("compileBalanceTestJava")
}

tasks.named("compileQaTestJava") {
    dependsOn project(":common").tasks.named("compileQaTestJava")
}

tasks.register("qaJar", Jar) {
    dependsOn tasks.named("qaTestClasses")
    archiveClassifier.set("qa-dev")
    from sourceSets.qaTest.output
    from project(":common").sourceSets.qaTest.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register("remapQaJar", net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named("qaJar")
    inputFile.set(tasks.named("qaJar", Jar).flatMap { it.archiveFile })
    archiveClassifier.set("qa")
    addNestedDependencies.set(false)
}

processResources {
inputs.property "version", project.version

filesMatching("fabric.mod.json") {
    expand "version": project.version
}
}

shadowJar {
exclude "architectury.common.json"

configurations = [project.configurations.shadowCommon]
archiveClassifier.set("dev-shadow")
}

remapJar {
injectAccessWidener = true
inputFile.set shadowJar.archiveFile
dependsOn shadowJar
archiveClassifier.set(null)
}

jar {
archiveClassifier.set("dev")
}

sourcesJar {
def commonSources = project(":common").sourcesJar
dependsOn commonSources
from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
    skip()
}
}

publishing {
publications {
    mavenFabric(MavenPublication) {
        artifactId = rootProject.archives_base_name + "-" + project.name
        from components.java
    }
}

// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
repositories {
    // Add repositories to publish to here.
}
}

// Persisted fzzy_config overrides the Java defaults, so drop it before each run.
tasks.matching { it.name == "runBalanceTestServer" }.configureEach {
    doFirst {
        project.delete("${project.projectDir}/build/balance-gametest/config/simplyswords")
    }
}
