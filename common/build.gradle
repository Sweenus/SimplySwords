architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/simplyswords.accesswidener")
}
repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal()
    maven {
        name 'Gegy'
        url 'https://maven.gegy.dev'
    }
    maven { url = "https://jitpack.io" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven {
        name = "FzzyMaven"
        url = "https://maven.fzzyhmstrs.me/"
    }
    maven { url 'https://maven.wispforest.io' }
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    // Remove the next line if you don't want to depend on the API
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    modImplementation "curse.maven:necronomicon-586157:${rootProject.necronomicon_version}"

    modImplementation "me.fzzyhmstrs:fzzy_config:${project.fzz_config_version}"
    modImplementation "com.github.ZsoltMolnarrr:TinyConfig:2.3.2"
    modImplementation "curse.maven:oracle-index-1206582:${rootProject.oracle_index_version}"
    modImplementation "curse.maven:open-parties-and-claims-636608:${project.openpac_version}"

    modImplementation "io.wispforest:owo-lib:0.12.15.1+1.21" // Needed to use OracleScreen from oracle_index :(
    // Simply Tooltips - hard dependency for modern tooltip rendering
    compileOnly files("${rootDir}/../simplytooltips/common/build/devlibs/SimplyTooltips-common-0.1.5-dev.jar")

    modCompileOnly "maven.modrinth:mythicmetals:${project.mythicmetals_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api:${rei_version}"
    modCompileOnly "dev.emi:emi-xplat-intermediary:${emi_version}:api"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        maven { url = "https://jitpack.io" }
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
    }
}
