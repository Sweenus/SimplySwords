configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    modImplementation("me.fzzyhmstrs:fzzy_config:${project.fzz_config_version}+neoforge") {
        exclude group: "net.neoforged.fancymodloader", module: "loader"
    }
    // KFF and Fzzy Config initialize across NeoForge module layers before ordinary remapped mod
    // dependencies are visible. Keep their library-only dependencies on the loader classpath in
    // development runs; release jars continue to obtain these from their normal bundled metadata.
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-reflect:2.0.20"
    forgeRuntimeLibrary "blue.endless:jankson:1.2.3"
    forgeRuntimeLibrary "net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7"
    modRuntimeOnly files("${rootDir}/../simplytooltips/neoforge/build/libs/SimplyTooltips-neoforge-0.1.5.jar")
    modRuntimeOnly "com.github.ZsoltMolnarrr:TinyConfig:2.3.2"
    //modImplementation ("curse.maven:gobber-301700:4007899")
    modCompileOnly "io.redspace:irons_spellbooks:${irons_spells_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
    modBalanceTestImplementation files(balanceTestIronsSpellbooks)
    modBalanceTestImplementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.2"
    modBalanceTestImplementation "dev.kosmx.player-anim:player-animation-lib-forge:2.0.4+1.21.1"
    modBalanceTestImplementation "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    modBalanceTestImplementation "io.redspace:irons_lib:1.21.1-2.1.0"
    modBalanceTestImplementation "net.neoforged:testframework:${neoforge_version}"
}

tasks.named("compileBalanceTestJava") {
    dependsOn project(":common").tasks.named("compileBalanceTestJava")
}

tasks.named("processBalanceTestResources") {
    from project(":common").sourceSets.balanceTest.resources
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

// Persisted fzzy_config overrides the Java defaults, so drop it before each run.
tasks.matching { it.name == "runBalanceTestServer" }.configureEach {
    doFirst {
        project.delete("${project.projectDir}/build/balance-gametest/config/simplyswords")
    }
}
