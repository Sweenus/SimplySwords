plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven {url "https://cursemaven.com"}
    maven { url = "https://jitpack.io" }
    maven { url "https://maven.blamejared.com" }
    maven { url "https://maven.shedaniel.me/" }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = "FzzyMaven"
        url = "https://maven.fzzyhmstrs.me/"
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "simplyswords-common.mixins.json"
        mixinConfig "simplyswords.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive false }

    modImplementation("me.fzzyhmstrs:fzzy_config:${project.fzz_config_version}+forge") {
        transitive = false
    }
    modImplementation "thedarkcolour:kfflang:${rootProject.kotlinforforge_version}"
    modImplementation "thedarkcolour:kfflib:${rootProject.kotlinforforge_version}"
    modImplementation "thedarkcolour:kffmod:${rootProject.kotlinforforge_version}"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-stdlib:2.0.20"
    forgeRuntimeLibrary "org.jetbrains.kotlin:kotlin-reflect:2.0.20"
    forgeRuntimeLibrary "blue.endless:jankson:1.2.3"
    forgeRuntimeLibrary "net.peanuuutz.tomlkt:tomlkt-jvm:${rootProject.tomlkt_version}"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.6.3"
    forgeRuntimeLibrary "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.10.2"
    def simplyTooltipsForge = file("${rootDir}/../simplytooltips-1.20.1/forge/build/libs/SimplyTooltips-forge-0.1.5-1.20.1.jar")
    if (simplyTooltipsForge.exists()) {
        modRuntimeOnly files(simplyTooltipsForge)
    }
    modRuntimeOnly "com.github.ZsoltMolnarrr:TinyConfig:2.3.2"
    //modImplementation ("curse.maven:gobber-301700:4007899")
    modCompileOnly "io.redspace:irons_spellbooks:${irons_spells_version}"
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-forge:${rei_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
